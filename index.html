<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Escuela Primaria José Vasconcelos</title>
    <link rel="stylesheet" href="estilos.css"> <!-- (Puente de coneccion)
<link rel="icon" type="image/png" href="img/favicon1.png">
</head>
<body>
    <!-- Encabezado de la App -->
  <header class="header"> 
    <div class="icono-app">🍽️</div>
    <h1>🍎 Menú Escolar 😋</h1>
    <h4>Escuela Primaria José Vasconcelos</h4>
    <p><em>Ciclo Rotativo</em></p>
  </header>

  <main class="contenedor"> <!--contenido principal-->

    <section class="tarjeta-hoy"> <!--agrupar contenido que pertenece a un mismo tema o sección.-->
      <span class="etiqueta-hoy">HOY</span> <!--sirve para envolver pedacitos pequeños de texto dentro de un bloque sin romper el renglón.-->
      <h2 id="fecha-hoy">Cargando fecha...</h2>
      <div class="comida-detalle"> <!--Es la caja contenedora estándar
        <h3 id="platillo-hoy">Cargando menú...</h3>
        <p id="bebida-hoy"></p>
      </div>
    </section>

    <section class="seccion-consulta">
      <label for="selector-fecha"><b>Consultar otra fecha:</b></label> <!--Es una etiqueta de texto descriptiva 
      <input type="date" id="selector-fecha"> <!--Es un campo de entrada de datos-->
      <div id="resultado-busqueda" class="tarjeta-resultado oculto">
      </div>
    </section>

    <section class="seccion-semanas">
      <div class="botones-pestana">
        <button id="btn-semana1" class="btn-pestana activa" onclick="mostrarSemana(1)">Semana 1</button>
        <button id="btn-semana2" class="btn-pestana" onclick="mostrarSemana(2)">Semana 2</button>
      </div>

      <div id="contenedor-semana" class="grid-dias">
      </div>
    </section>

  </main>

  <footer class="pie-pagina">
    <p><b>Nota:</b> Este menú opera en un ciclo rotativo de 2 semanas continuas.</p>
    <p><small>Desarrollado para la Esc. Prim. José Vasconcelos</small></p>
  </footer>

  <script src="app.js"></script> <!--Es el enlace que conecta el archivo JavaScript-->
    
</body>
</html>
